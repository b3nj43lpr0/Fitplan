<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f7cf6">
  <meta name="description" content="Cuenta calorías, registra comidas y ejercicio, y genera recetas y rutinas.">
  <title>FitPlan</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <nav class="nav" aria-label="Secciones">
      <div class="brand"><img src="icon.svg" alt="" width="28" height="28"><span>FitPlan</span></div>
      <button data-view="hoy" class="active"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg></span><span>Hoy</span></button>
      <button data-view="comidas"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8"/><path d="M4 3v5a3 3 0 0 0 6 0V3"/><path d="M7 11v10"/><path d="M17 21V3c-2.2 1.4-3.5 4-3.5 7 0 2 1.5 3 3.5 3"/></svg></span><span>Comidas</span></button>
      
      <button data-view="rutinas"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/></svg></span><span>Entrenar</span></button>
      <button data-view="coach"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01" stroke-width="3"/></svg></span><span>Coach</span></button>
      <button data-view="progreso"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-7"/></svg></span><span>Progreso</span></button>
      <button data-view="perfil" class="nav-perfil"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.4-6 8-6s6.5 2 8 6"/></svg></span><span>Perfil</span></button>
    </nav>
    <main id="main"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="foods.js"></script>
  <script src="data.js"></script>
  <script src="firebase-config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/hoy.js"></script>
  <script src="js/comidas.js"></script>
  <script src="js/etiqueta.js"></script>
  <script src="js/actividad.js"></script>
  <script src="js/gym.js"></script>
  <script src="js/recetas.js"></script>
  <script src="js/entrenar.js"></script>
  <script src="js/progreso.js"></script>
  <script src="js/perfil.js"></script>
  <script src="js/coach.js"></script>
  <script src="js/ia.js"></script>
  <script src="js/ux.js"></script>
  <script src="js/reloj.js"></script>
  <script src="js/emoji.js"></script>
  <script src="js/main.js"></script>
  <script src="sync.js"></script>
</body>
</html>
